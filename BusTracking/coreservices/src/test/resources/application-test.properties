# ###########################################
# DATABASE CONFIGURATION (TEST MODE)
# ###########################################

# Use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=day,value;CASE_INSENSITIVE_IDENTIFIERS=TRUE

# Driver class name for H2
spring.datasource.driver-class-name=org.h2.Driver

# Credentials for H2 (not used, but required by Spring)
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 web console
spring.h2.console.enabled=true

# Liquibase settings
spring.liquibase.change-log=classpath:/db/changelog/db.changelog.xml
spring.liquibase.drop-first=true